name: build-nixkali-iso
on: [workflow_dispatch]

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Build in Kali Docker
        run: |
          docker run --privileged -v "$PWD:/work" -w /work kalilinux/kali-rolling /bin/bash -c "
            apt-get update && \
            apt-get install -y git live-build cdebootstrap debootstrap devscripts fakeroot fakechroot python3-pil xorriso squashfs-tools zip wget gnupg && \
            bash build-nix-kali.sh && \
            chown -R 1000:1000 /work
          "

      - uses: actions/upload-artifact@v4
        with:
          name: nixkali-iso
          path: nixkali-out/*.iso
          retention-days: 7

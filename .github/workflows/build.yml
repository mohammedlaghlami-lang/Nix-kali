name: build-nixkali-iso
on: [workflow_dispatch]

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt update
          sudo apt install -y git live-build cdebootstrap devscripts python3-pil xorriso squashfs-tools
      - name: build
        run: |
          sudo bash build-nix-kali.sh
          sudo chown -R $USER:$USER ~/nixkali-out
      - uses: actions/upload-artifact@v4
        with:
          name: nixkali-iso
          path: ~/nixkali-out/*.iso
          retention-days: 7
